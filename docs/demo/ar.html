جة 2026. تقييم 360 درجة يعني أن يقيّم كل منا نفسه، ويقيّمه رئيسه وزملاؤه ومن يعمل معهم، فتكتمل الصورة من كل الجهات لا من جهة واحدة.","why":["نراجع معًا أداءنا منذ بداية العام حتى الآن: أين تميزنا، وأين نحتاج أن نتطور، وما الجهود الطيبة التي لا يراها الجميع — لنبني لكل واحد منا خطة تطوير ودعم واضحة، لما فيه خير مؤسستنا وثقافة العمل بيننا.","ما تكتبه بصدق يساعد زميلك على أن يتطور، ويساعدنا على أن نرى أين نحتاج إلى الدعم والتحسين."],"values":[["الإحسان","أتقن تقييمك كما تتقن عملك: إذا اخترت 1 أو 2 أو 5 فاكتب مثالًا حقيقيًا يوضح السبب."],["الإخلاص","نيتنا أن يساعد بعضنا بعضًا على التحسن — لا مجاملة ولا لوم."],["الأمانة","قيّم ما رأيته بنفسك فقط. وما تكتبه أمانة عندنا: الشخص الذي تقيّمه لن يعرف أنك الكاتب، ولا يطّلع على الإجابات الفردية إلا مسؤول التقييم، وقد تصله ملاحظاتك المكتوبة دون اسمك — فاكتب بلطف ودون تفاصيل تكشف أنك الكاتب."],["الشفافية","قل الحق بوضوح وبلطف، كما تحب أن يُقال لك."]],"steps":["ثلاث خطوات: تقييم نفسك، ثم زملاء يظهرون لك لأنك تعمل معهم، ثم إدارات تتعامل معها.","اضغط رقمًا من 1 إلى 5، والجمل تحت كل بند توضح المقصود. وإن لم ترَ الشيء بنفسك فاختر «لا أعرف» — لا يُحسب على أحد.","قيّم الفترة كلها، لا موقفًا واحدًا.","يستغرق حوالي 10 دقائق لنفسك و3 دقائق لكل شخص. تُحفظ إجاباتك تلقائيًا، فتستطيع التوقف والعودة، والتعديل بعد الإرسال حتى آخر موعد."],"sign":"فريق القيادة"},"me":{"name":"هالة كامل","dept":"البرامج"},"deadline":"2026-12-01","drafts":{},"done":0,"total":7,"as":null,"selfDone":false,"selfPrev":null,"isHead":true,"persons":[{"key":"nadia@example.org","name":"نادية رحمن","dept":"القيادة","relCode":"MEMBER_TO_HEAD","reason":"رئيسك المباشر","showLead":true,"role":[],"done":false,"prev":null},{"key":"karim@example.org","name":"كريم زكي","dept":"البرامج","relCode":"HEAD_TO_MEMBER","reason":"من فريقك المباشر","showLead":false,"role":[],"done":false,"prev":null},{"key":"tarek@example.org","name":"طارق سالم","dept":"البرامج","relCode":"HEAD_TO_MEMBER","reason":"من فريقك المباشر","showLead":false,"role":[],"done":false,"prev":null},{"key":"yasmin@example.o
