<!DOCTYPE html><html lang="en" dir="ltr"><head><meta charset="utf-8"><title>nonprofit-360 demo</title><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet"><style>:root{--g:#1f5f8b;--sky:#35b0d8;--f:Inter}:root{--g2:#eef5fa;--ink:#14283a;--mute:#5b6b7a;--line:#e3ebf2;--bg:#f3f7fa;--red:#c0392b;--amb:#b7791f;--ambbg:#fdf3e1}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f),Tahoma,Arial,sans-serif;font-size:16px;line-height:1.7;text-align:start}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px 110px}
.card{background:#fff;border-radius:14px;padding:16px 18px;margin:0 0 12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}

.bar{background:var(--g2);border-radius:99px;height:10px;overflow:hidden;margin:10px 0 4px}.bar i{display:block;height:100%;background:var(--g);border-radius:99px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}
.who b{display:block;font-weight:700}.who span{color:var(--mute);font-size:13.5px}
button{font-family:inherit}.btn{background:var(--g);color:#fff;border:0;padding:9px 18px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn.soft{background:var(--g2);color:var(--g)}.btn.ghost{background:transparent;color:var(--g);padding:9px 6px}.btn:disabled{opacity:.6}
.ok{color:var(--g);font-weight:700;font-size:14px;margin-inline-end:8px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}.top .t{flex:1}.top h1{font-size:19px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--mute)}
.q{padding:14px 0;border-top:1px solid var(--line)}.q:first-child{border-top:0;padding-top:4px}
.qt{font-weight:700;font-size:16px}.qh{color:var(--mute);font-size:13.5px;margin:2px 0 8px}.qh div::before{content:"• ";color:var(--g)}
.more{background:none;border:0;color:var(--g);font-size:13px;cursor:pointer;padding:0;margin-inline-start:6px}
.sc{display:flex;gap:6px;flex-wrap:wrap}.sc button{min-width:46px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:17px;font-weight:700;color:var(--ink);cursor:pointer}
.sc button.na{min-width:auto;padding:0 12px;font-size:14px;font-weight:500;color:var(--mute)}
.sc button.on.v1,.sc button.on.v2{background:var(--red);border-color:var(--red);color:#fff}.sc button.on.v3{background:var(--amb);border-color:var(--amb);color:#fff}
.sc button.on.v4,.sc button.on.v5{background:var(--g);border-color:var(--g);color:#fff}.sc button.on.na{background:#6b7a73;border-color:#6b7a73;color:#fff}
.picked{font-size:13.5px;color:var(--mute);margin-top:6px;min-height:1em}
.ev{margin-top:8px;background:var(--ambbg);border-radius:10px;padding:10px}.ev label{font-size:14px;font-weight:700;color:var(--amb)}
textarea,select{width:100%;font-family:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;color:var(--ink);text-align:start}
textarea{min-height:74px;resize:vertical}textarea:focus,select:focus{outline:none;border-color:var(--g)}
.cnt{font-size:12px;color:var(--mute);text-align:end}
.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:4px}.field .mute{margin:-2px 0 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font-size:15px;cursor:pointer}
.chips button.on{background:var(--g);border-color:var(--g);color:#fff}
.bad{outline:2px solid var(--red);outline-offset:4px;border-radius:10px}
.foot{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:12px 14px;box-shadow:0 -2px 8px rgba(0,0,0,.05)}
.foot .in{max-width:720px;margin:0 auto;display:flex;gap:10px;align-items:center}.foot .btn{flex:1;padding:13px;font-size:17px}
.brand{display:flex;flex-direction:column;align-items:center;gap:2px;margin:4px 0 12px}.brand img{height:80px;width:auto}.brand .org{color:var(--g);font-weight:700;font-size:18px}.brand .tag{color:var(--g);font-weight:700;font-size:15px}
.intro p{margin:8px 0}.intro h1{margin-bottom:2px}.pr div{background:var(--g2);border-radius:10px;padding:8px 12px;margin:6px 0}.pr b{color:var(--g)}
.vt{font-weight:700;color:var(--g);margin-top:12px}
.sm{font-size:13px;color:var(--mute);margin-top:4px;line-height:1.6}.steps{margin:6px 0 8px;padding-inline-start:22px}.steps li{margin:4px 0}
.sv{font-size:12.5px;color:var(--mute);max-width:42%;line-height:1.4}.who .dr{display:block;color:#b7791f;font-size:13px;font-weight:700}
.note{background:#fff8e6;border-radius:12px;padding:12px 14px;font-size:14px}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--g);color:#fff;padding:10px 20px;border-radius:99px;font-weight:700;z-index:9;box-shadow:0 4px 12px rgba(0,0,0,.15)}</style></head><body><div dir="ltr" style="position:sticky;top:0;z-index:50;background:#fff4d6;border-bottom:1px solid #f0d58a;color:#5a4300;font:14px/1.5 Arial,sans-serif;padding:8px 14px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center">

ne, open it and press «{skip}».","ui.homeNote":"🔒 Your evaluation is confidential · 💾 answers save automatically and you can edit until the deadline.","ui.backToIntro":"Before we start: why we do this evaluation and how to fill it in","ui.draftEdit":"✎ You have a change not sent yet — press «Continue», then «Send»","ui.draftStarted":"✎ Started — your answers are saved","ui.done":"✓ Done","ui.resume":"Continue","ui.edit":"Edit","ui.begin":"Start","ui.back":"← Back (what you wrote is saved)","ui.scaleMeaning":"5 = always, a model for others · 4 = in most situations · 3 = sometimes · 2 = rarely, needs clear improvement · 1 = almost never, and it hurts the work","ui.extremeNote":"After a 1, 2 or 5, write an example you saw yourself: a higher or lower score needs something to support it.","ui.naNote":"\"I don't know\": I have not seen this myself. It counts against nobody.","ui.na":"I don't know","ui.naPicked":"I don't know — I have not seen this myself, and it does not count against them","ui.saving":"Saving your draft…","ui.saved":"✓ Your answers saved automatically","ui.savedLocal":"✓ Saved on this device","ui.savedLocalRetry":"✓ Saved on this device — we will try again","ui.restored":"↺ We picked up where you stopped — your unsent answers are saved as they were.","ui.restoredShort":"↺ Your draft was restored","ui.autosaveHint":"Your answers save automatically as you write","ui.more":"More…","ui.evidenceExample":"Example: in August the monthly report arrived a week late with no warning, so the donor update was delayed.","ui.chars":"{n} characters ({min} or more needed)","ui.evidenceLabel":"You chose {v} — give an example you saw yourself: what happened? roughly when? what was the result?","ui.needDid":"You chose 1 or 2, so please write the support you gave to help improve it ({n} characters or more)","ui.needAnswer":"Choose an answer or complete the question outlined in red","ui.missing":"Some items have no score or no example — see what is outlined in red","ui.send": league":"— choose a colleague —","ui.recogWhy":"What did each of them do, exactly?","ui.recogWhyHelp":"For each colleague, what they did, starting with their name.","ui.deptRating":"Rating a department: {name}","ui.deptHint":"Rate the department as a whole, not one person: how does it work with you and your team? (\"we\" means you and your team.)","ui.deptFreqQ":"How often do you deal with this department?","ui.deptSkip":"I have not dealt with this department","ui.deptSkipQ":"You do not deal with this department?","ui.deptSkipConfirm":"You have not dealt with {name}? That will be recorded instead of a rating.","ui.deptExample":"A real example from your dealings with this department","ui.deptExampleHelp":"What happened? When? What was the result?","ui.deptSugg":"What one change by this department would improve the work between you?","ui.needDeptFreq":"Choose how often you deal with this department","ui.needDeptExample":"Write a real example ({n} characters or more)"},"colors":{"primary":"#1f5f8b","accent":"#35b0d8","ink":"#14283a","mist":"#eef5fa"},"org":"Example Foundation","tagline":"Growing together","logo":"","cycle":"2026","intro":{"opening":"This is your personal page for the 360-degree performance evaluation 2026. A 360-degree evaluation means each of us rates ourselves, and is rated by our manager and the colleagues we work with, so the picture is complete from every side, not from one.","why":["Together we review how we have worked since the start of the year: where we did well, where we need to grow, and the good efforts not everyone sees — so each of us gets a clear plan for development and support, for the good of our organisation and our culture.","What you write honestly helps a colleague grow, and helps us see where we need support and improvement."],"values":[["Excellence","Do this evaluation as carefully as your work: if you choose 1, 2 or 5, write a real example that explains why."],["Sincerity","Our intention is to help each other grow — no flattery and no blame."],["Trust","Rate only what you have seen yourself. What you write is held in trust: the person you rate will not know it was you, only the evaluation admin sees individual answers, and your written notes may reach the person without your name — so write kindly, without details that reveal who you are."],["Transparency","Say what is true, clearly and kindly, the way you would like it said to you."]],"steps":["Three parts: rate yourself, then colleagues shown to you because you work with them, then departments you deal with.","Tap a number from 1 to 5; the lines under each item explain what it means. If you have not seen it yourself, choose \"I don't know\" — it counts against nobody.","Rate the whole period, not one moment.","It takes about 10 minutes for yourself and 3 minutes per person. Your answers save automatically, so you can stop and come back, and edit after sending until the deadline."],"sign":"The leadership team"},"me":{"name":"Hala Kamel","dept":"Programs"},"deadline":"2026-12-01","drafts":{},"done":0,"total":7,"as":null,"selfDone":false,"selfPrev":null,"isHead":true,"persons":[{"key":"nadia@example.org","name":"Nadia Rahman","dept":"Leadership","relCode":"MEMBER_TO_HEAD","reason":"Your direct manager","showLead":true,"role":[],"done":false,"prev":null},{"key":"karim@example.org","name":"Karim Zaki","dept":"Programs","relCode":"HEAD_TO_MEMBER","reason":"In your team","showLead":false,"role":[],"done":false,"prev":null},{"key":"tarek@example.org","name":"Tarek Salem","dept":"Programs","relCode":"HEAD_TO_MEMBER","reason":"In your team","showLead":false,"role":[],"done":false,"prev":null},{"key":"yasmin@example.org","name":"Yasmin Farid","dept":"Programs","relCode":"HEAD_TO_MEMBER","reason":"In your team","showLead":false,"role":[],"done":false,"prev":null},{"key":"khaled@example.org","name":"Khaled Nour","dept":"Finance","relCode":"PEER_OTHER","reason":"Fellow manager: you coordinate across departments","showLead":false,"role":["RA1","RA2"],"done":false,"prev":null},{"key":"omar@example.org","name":"Omar Haddad","dept":"Communications","relCode":"PEER_OTHER","reason":"Fellow manager: you coordinate across departments","showLead":false,"role":[],"done":false,"prev":null}],"depts":[{"name":"Communications","done":false,"prev":null},{"name":"Finance","done":false,"prev":null},{"name":"Leadership","done":false,"prev":null}],"colleagues":[{"key":"nadia@example.org","name":"Nadia Rahman","dept":"Leadership"},{"key":"khaled@example.org","name":"Khaled Nour","dept":"Finance"},{"key":"saeed@example.org","name":"Saeed Amin","dept":"Finance"},{"key":"mona@example.org","name":"Mona Fawzy","dept":"Finance"},{"key":"rami@example.org","name":"Rami Wahba","dept":"Finance"},{"key":"no-email:samir lotfy","name":"Samir Lotfy","dept":"Finance"},{"key":"karim@example.org","name":"Karim Zaki","dept":"Programs"},{"key":"yasmin@example.org","name":"Yasmin Farid","dept":"Programs"},{"key":"tarek@example.org","name":"Tarek Salem","dept":"Programs"},{"key":"omar@example.org","name":"Omar Haddad","dept":"Communications"},{"key":"laila@example.org","name":"Laila Aziz","dept":"Communications"}],"core":[{"id":"C1","title":"Responsiveness","help":["Replies to messages and requests within the agreed time.","Does not need repeated chasing before acting.","If late, warns in advance and gives a new date."]},{"id":"C2","title":"Communication and clarity","help":["Shares important information early and clearly with the people who need it.","Raises problems and delays as soon as they appear, and does not hide them.","Messages are clear and respectful; the reader understands what is needed."]},{"id":"C3","title":"Delivering on time","help":["Delivers what they committed to by the agreed date.","Organises priorities so tasks do not pile up.","Keeps to meeting and reporting deadlines, where these are part of the job."]},{"id":"C4","title":"Taking responsibility","help":["Owns their part when something goes wrong and does not blame others.","Follows a task through to the end without being asked.","Brings a suggested solution when raising a problem."]},{"id":"C5","title":"Quality and accuracy","help":["Delivers correct work the first time, without repeated mistakes.","Checks details, figures and documents before handing over.","Keeps records of their work in a way others can understand."]},{"id":"C6","title":"Working with colleagues and other departments","help":["Helps colleagues when needed, even outside their own tasks.","Coordinates with other departments before acting, not after (where relevant).","Stays respectful even in disagreement."]},{"id":"C7","title":"Following the organisation's rules","help":["Follows financial and administrative rules and approval steps.","Protects confidential information and the organisation's money and property.","Does not skip any required step or document."]},{"id":"C8","title":"Learning, feedback and adapting to change","help":["Accepts feedback and changes their approach because of it.","Adapts when priorities or circumstances change.","Builds their skills and uses new tools to improve their work."]}],"lead":[{"id":"L1","title":"Clear expectations and priorities","help":["Makes clear to each team member what is expected, by when, and what success looks like.","Does not change priorities without explaining why."]},{"id":"L2","title":"Listening and being reachable","help":["Can be reached when needed.","Listens to the team before judging, and takes their views into account."]},{"id":"L3","title":"Supporting and developing the team","help":["Removes obstacles and provides what the team needs.","Coaches, guides and gives regular feedback aimed at improvement."]},{"id":"L4","title":"Owning the team's results","help":["Takes responsibility for the team's performance towards leadership.","Does not blame team members for failures, and deals with the causes personally."]},{"id":"L5","title":"Fairness within the team","help":["Treats team members fairly, without favourites.","Bases decisions and ratings on facts, not impressions."]},{"id":"L6","title":"Giving credit where it is due","help":["Recognises team members' efforts and makes them visible to others.","Does not take sole credit for the team's achievements."]},{"id":"L7","title":"Solving problems and deciding","help":["Makes decisions in time and does not postpone problems.","Solves problems personally instead of passing them on or escalating without need."]}],"dept":[{"id":"D1","title":"Responding to our requests","help":["The department replies to our requests within the agreed time."]},{"id":"D2","title":"Sharing clear information","help":["It shares important information and updates with us early and clearly."]},{"id":"D3","title":"Quality of what we receive","help":["What we receive from it is complete, correct and does not need redoing."]},{"id":"D4","title":"Keeping agreed deadlines","help":["It keeps the deadlines it promised us."]},{"id":"D5","title":"Agreeing before joint work","help":["It agrees with us before starting any joint work, not after a problem appears."]}],"headItems":[{"id":"X1","title":"Achieving what was expected","help":["Delivered what was expected since the start of the period, in the agreed quantity and quality.","If nothing clear was expected of them, choose \"I don't know\" — that is not their fault."]}],"role":[{"id":"RA1","title":"Accurate, complete records","help":["Financial and administrative records are correct, complete and on time.","Every payment and decision has the documents to support it."]},{"id":"RA2","title":"Helpful service to colleagues","help":["Explains procedures clearly and answers requests on time.","Helps colleagues get it right, instead of only refusing what is wrong."]}],"myRole":[],"selfOpen":[{"id":"S_EXPECT","title":"What was expected of you since the start of the period, as you understood it?","help":"From your job description, what your manager asked, or your team plan. If nothing was written or clear, say so plainly.","
